<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Spotify Clone - Liked</title>
    <link rel="stylesheet" href="style.css" />
    <script src="songs.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body class="app-page" data-page="playlist">
    <div class="app">
      <aside class="sidebar">
        <a href="index.html" class="logo">
          <div class="fallback-logo">Spotify<span>●</span></div>
        </a>
        <!-- test// -->
        <nav class="main-nav">
          <a href="index.html" class="nav-link">
            <svg
              class="sidebar-icon home-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M3 10.8 12 3l9 7.8V21h-6v-7H9v7H3z" />
            </svg>
            <span>Home</span>
          </a>

          <a href="search.html" class="nav-link">
            <svg
              class="sidebar-icon search-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="10.8" cy="10.8" r="7.3" />
              <path d="m16.2 16.2 4.6 4.6" />
            </svg>
            <span>Search</span>
          </a>

          <a href="likedSongs.html" class="nav-link active">
            <svg
              class="sidebar-icon library-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M4 3v18M8 3v18M12 3v18M17 3l4 18" />
            </svg>
            <span>Your Library</span>
          </a>
        </nav>

        <div class="library-actions">
          <a href="likedSongs.html" class="nav-link">
            <svg
              class="sidebar-icon create-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M3 3h18v18H3z" />
              <path d="M12 7v10M7 12h10" class="icon-cutout" />
            </svg>
            <span>Create Playlist</span>
          </a>

          <a href="likedSongs.html" class="nav-link">
            <svg
              class="sidebar-icon liked-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.8l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.5a5.5 5.5 0 0 0 0-7.8z"
              />
            </svg>
            <span>Liked Songs</span>
          </a>
        </div>

        <div class="sidebar-bottom">
          <div class="footer-links">
            <a href="#">Legal</a>
            <a href="#">Privacy Center</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Cookies</a>
            <a href="#">About</a>
            <a href="#">Ads</a>
          </div>

          <button class="lang-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
            </svg>
            English
          </button>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="topbar-spacer"></div>
          <div class="auth-buttons" id="authArea">
            <a href="SignUp.html" class="signup">Sign up</a
            ><a href="login.html" class="login">Log in</a>
          </div>
        </header>
        <section class="playlist-hero">
          <img src="images/cover-2.svg" alt="Deep Focus" />
          <div>
            <span>Playlist</span>
            <h1>Deep Focus</h1>
            <p>Keep calm and focus with ambient and post-rock music.</p>
            <small>Spotify • 10 demo tracks</small>
          </div>
        </section>
        <section class="playlist-tracks">
          <div class="playlist-toolbar">
            <button
              id="playlistPlay"
              class="round-play"
              aria-label="Play playlist"
            >
              ▶</button
            ><a
              href="likedSongs.html"
              class="playlist-heart"
              title="Liked Songs"
              >♡</a
            >
            ···
          </div>
          <div class="playlist-columns">
            <span>#</span><span>Title</span><span>Duration</span
            ><span>Like</span>
          </div>
          <div id="songList" class="song-list"></div>
        </section>
      </main>
    </div>
    <footer class="player" aria-label="Music player">
      <div class="track-info">
        <img id="playerCover" src="images/cover-1.svg" alt="Cover" />
        <div style="min-width: 0">
          <strong id="playerTitle">Select a track</strong
          ><small id="playerArtist">Demo audio</small>
        </div>
        <button
          class="icon-btn heart-btn"
          id="playerLike"
          aria-label="Like song"
          title="Like song"
        >
          ♡
        </button>
      </div>
      <div class="player-center">
        <div class="player-buttons">
          <button class="icon-btn" id="prevBtn" aria-label="Previous">⏮</button
          ><button class="icon-btn play-btn" id="playBtn" aria-label="Play">
            ▶</button
          ><button class="icon-btn" id="nextBtn" aria-label="Next">⏭</button>
        </div>
        <div class="seek-row">
          <span id="currentTime">0:00</span
          ><input
            type="range"
            id="seek"
            min="0"
            max="100"
            value="0"
            aria-label="Seek"
          /><span id="duration">0:00</span>
        </div>
      </div>
      <div class="volume-row">
        🔊
        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.7"
          aria-label="Volume"
        />
      </div>
      <audio id="audio" preload="metadata"></audio>
    </footer>
  </body>
</html>
